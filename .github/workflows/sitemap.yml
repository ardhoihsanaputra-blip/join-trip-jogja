name: Auto Generate Sitemap Prambanan

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap.xml
        run: |
          DOMAIN="https://prambanan.biz.id"
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml
          find . -type f -name "*.html" ! -path "./.git/*" | sort | while read -r file; do
            clean_path="${file#./}"
            if [ "$clean_path" = "index.html" ]; then
              url="$DOMAIN/"
            else
              url="$DOMAIN/$clean_path"
            fi
            lastmod=$(git log -1 --format="%cI" -- "$file")
            [ -z "$lastmod" ] && lastmod=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "  <url>" >> sitemap.xml
            echo "    <loc>$url</loc>" >> sitemap.xml
            echo "    <lastmod>$lastmod</lastmod>" >> sitemap.xml
            echo "  </url>" >> sitemap.xml
          done
          echo '</urlset>' >> sitemap.xml

      - name: Commit and push sitemap.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update full sitemap.xml" && git push)
