name: Replace Domain to jointripjogja.my.id
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace prambanan.biz.id with jointripjogja.my.id
        run: |
          find . -maxdepth 3 -type f \( -name "*.html" -o -name "*.xml" -o -name "*.txt" -o -name "*.json" -o -name "*.js" -o -name "*.md" \) \
            -exec sed -i 's/prambanan\.biz\.id/jointripjogja.my.id/g' {} +
          if git diff --quiet; then
            echo "No occurrences of prambanan.biz.id found"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update domain from prambanan.biz.id to jointripjogja.my.id"
            git push
          fi
